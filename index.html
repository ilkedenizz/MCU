<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCU Watchlist // Tam İzleme Takibi</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #121216;
      --surface-hover: #18181e;
      --border: #24242c;
      --text: #f0f0f5;
      --muted: #8a8a98;
      --accent: #e62429;
      --accent-soft: rgba(230, 36, 41, 0.14);
      --ok: #22c55e;
      --ok-soft: rgba(34, 197, 94, 0.14);
      --movie: #3b82f6;
      --series: #a855f7;
      --anim: #f59e0b;
      --special: #14b8a6;
      --radius: 10px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      padding: 24px 16px 80px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .badge-mcu {
      background: var(--accent);
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1.5px;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: var(--mono);
    }

    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }

    .mode-switch {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active { background: var(--accent); color: #fff; }

    .dashboard {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 720px) { .dashboard { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .progress-title {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-family: var(--mono);
    }

    .progress-stat { font-family: var(--mono); font-size: 18px; font-weight: 700; }

    .bar-track {
      height: 8px;
      background: #1d1d24;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ff5b60);
      width: 0%;
      transition: width 0.25s ease;
    }

    .mini-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .mini-box {
      background: #0e0e12;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .mini-box span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .mini-box strong { font-family: var(--mono); font-size: 13px; }

    .up-next-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(145deg, var(--surface), #161216);
      border-color: rgba(230, 36, 41, 0.35);
    }

    .up-next-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .up-next-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .up-next-meta { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: var(--surface-hover); border-color: #363642; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      justify-content: center;
    }
    .btn-primary:hover { background: #c81d22; }
    .btn-share {
      background: var(--ok-soft);
      border-color: rgba(34, 197, 94, 0.4);
      color: #86efac;
      font-weight: 600;
    }
    .btn-share:hover { background: rgba(34, 197, 94, 0.22); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 210px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent); }

    select.filter-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
      justify-content: space-between;
      align-items: center;
    }

    .group-block {
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .group-header {
      padding: 13px 16px;
      background: #15151b;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .group-title { font-size: 14px; font-weight: 700; }
    .group-count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      background: #0d0d11;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .item-list { list-style: none; }
    .group-block.collapsed .item-list { display: none; }

    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: var(--surface-hover); }

    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #3c3c4a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
      font-size: 12px;
      color: transparent;
    }

    .item-row.watched .checkbox {
      background: var(--ok);
      border-color: var(--ok);
      color: #052e16;
      font-weight: 900;
    }

    .order-num {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      width: 30px;
      flex-shrink: 0;
    }

    .item-info { flex: 1; min-width: 0; }
    .item-title { font-size: 14px; font-weight: 600; transition: color 0.15s ease; }

    .item-row.watched .item-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .tag {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
      flex-shrink: 0;
    }

    .tag-movie { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
    .tag-series { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; }
    .tag-anim { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
    .tag-special { background: rgba(20, 184, 166, 0.15); color: #5eead4; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #141419;
      border: 1px solid var(--ok);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--mono);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>

<div class="container">
  <header>
    <div>
      <div class="brand">
        <span class="badge-mcu">MCU</span>
        <h1>Marvel Sinematik Evreni İzleme Listesi</h1>
      </div>
      <p class="subtitle">77 Yapım • İşaretlerin hem tarayıcına hem de sayfa linkine (#w=) otomatik işlenir</p>
    </div>

    <div class="mode-switch" role="group" aria-label="Sıralama Modu">
      <button class="mode-btn active" id="btnRelease" onclick="setMode('release')">📅 Çıkış Sırası</button>
      <button class="mode-btn" id="btnStory" onclick="setMode('story')">⏳ Hikaye Sırası</button>
    </div>
  </header>

  <section class="dashboard">
    <div class="card">
      <div class="progress-header">
        <span class="progress-title">Genel İlerleme</span>
        <span class="progress-stat" id="totalStat">0 / 77 (%0)</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="progressBar"></div>
      </div>
      <div class="mini-stats">
        <div class="mini-box"><span>Film</span><strong id="statMovie">0/38</strong></div>
        <div class="mini-box"><span>Dizi</span><strong id="statSeries">0/31</strong></div>
        <div class="mini-box"><span>Animasyon</span><strong id="statAnim">0/6</strong></div>
        <div class="mini-box"><span>Özel</span><strong id="statSpecial">0/2</strong></div>
      </div>
    </div>

    <div class="card up-next-card">
      <div>
        <div class="up-next-label">▶ Sıradaki Yapım</div>
        <div class="up-next-title" id="nextTitle">Yükleniyor...</div>
        <div class="up-next-meta" id="nextMeta"></div>
      </div>
      <button class="btn btn-primary" id="btnMarkNext" onclick="markNextWatched()">✓ İzlendi İşaretle</button>
    </div>
  </section>

  <section class="controls">
    <input type="text" class="search-input" id="searchInput" placeholder="Film, dizi, yıl veya #sıra ara..." oninput="render()" />
    <select class="filter-select" id="typeFilter" onchange="render()">
      <option value="all">Tüm Türler</option>
      <option value="movie">Sadece Filmler (38)</option>
      <option value="series">Sadece Diziler (31)</option>
      <option value="anim">Animasyon / Kısa (6)</option>
      <option value="special">Özel Bölümler (2)</option>
    </select>
    <select class="filter-select" id="statusFilter" onchange="render()">
      <option value="all">Tümü</option>
      <option value="unwatched">İzlenmeyenler</option>
      <option value="watched">İzlenenler</option>
    </select>
  </section>

  <div class="toolbar-actions">
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-share" onclick="copyShareLink()">🔗 İlerleme Linkini Kopyala</button>
      <button class="btn" onclick="exportBackup()">⬇ JSON Yedek</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">⬆ Yedek Yükle</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)" />
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn" onclick="toggleAllGroups(false)">Tümünü Aç</button>
      <button class="btn" onclick="toggleAllGroups(true)">Tümünü Daralt</button>
      <button class="btn" style="color:#fca5a5;" onclick="resetAll()">Sıfırla</button>
    </div>
  </div>

  <main id="listContainer"></main>
</div>

<div class="toast" id="toast">✓ Kaydedildi</div>

const STORAGE_KEY = `mcu_watchlist_v3_${location.pathname}`;
let watchedSet = new Set();
let currentMode = "release";
let collapsedGroups = new Set();

// ID listesini kısa aralık koduna sıkıştırır: [1,2,3,7,9,10] -> "1-3,7,9-10"
function encodeIds(ids) {
  const sorted = [...ids].map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
  if (!sorted.length) return "";
  const ranges = [];
  let start = sorted[0], end = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === end + 1) {
      end = sorted[i];
    } else {
      ranges.push(start === end ? `${start}` : `${start}-${end}`);
      start = end = sorted[i];
    }
  }
  ranges.push(start === end ? `${start}` : `${start}-${end}`);
  return ranges.join(",");
}

// URL hash kodunu tekrar ID dizisine çözer: "1-3,7" -> [1,2,3,7]
function decodeIds(str) {
  const result = [];
  if (!str) return result;
  str.split(",").forEach(part => {
    if (part.includes("-")) {
      const [a, b] = part.split("-").map(Number);
      if (!isNaN(a) && !isNaN(b) && a <= b && b - a <= 500) {
        for (let i = a; i <= b; i++) result.push(i);
      }
    } else {
      const n = Number(part);
      if (!isNaN(n) && n > 0) result.push(n);
    }
  });
  return result;
}

function loadState() {
  // 1. Öncelik: URL Hash (#w=...)
  const hashMatch = location.hash.match(/w=([0-9,-]+)/);
  if (hashMatch && hashMatch[1]) {
    watchedSet = new Set(decodeIds(hashMatch[1]));
  } else {
    // 2. Öncelik: Tarayıcı localStorage
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.watched)) watchedSet = new Set(parsed.watched);
        if (parsed.mode === "story" || parsed.mode === "release") currentMode = parsed.mode;
      }
    } catch {}
  }

  // Mod bilgisini URL veya localStorage'dan al
  if (location.hash.includes("m=story")) currentMode = "story";
  syncUrlHash();
}

function syncUrlHash() {
  const encoded = encodeIds(watchedSet);
  const parts = [];
  if (encoded) parts.push(`w=${encoded}`);
  if (currentMode === "story") parts.push(`m=story`);
  const newHash = parts.length ? `#${parts.join("&")}` : "";
  if (location.hash !== newHash) {
    history.replaceState(null, "", newHash || location.pathname + location.search);
  }
}

function saveState(msg = "✓ Kaydedildi (Link & Tarayıcı)") {
  syncUrlHash();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      watched: [...watchedSet],
      mode: currentMode
    }));
  } catch {}
  showToast(msg);
}

function showToast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

function copyShareLink() {
  syncUrlHash();
  const fullUrl = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(fullUrl).then(() => {
      showToast("🔗 İlerleme linki panoya kopyalandı!");
    }).catch(() => prompt("İlerleme linkini kopyala:", fullUrl));
  } else {
    prompt("İlerleme linkini kopyala:", fullUrl);
  }
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById("btnRelease").classList.toggle("active", mode === "release");
  document.getElementById("btnStory").classList.toggle("active", mode === "story");
  saveState(mode === "story" ? "⏳ Hikaye sırası aktif" : "📅 Çıkış sırası aktif");
  render();
}

function getOrderedItems() {
  const copy = [...MCU_ITEMS];
  if (currentMode === "story") {
    copy.sort((a, b) => a.storyOrder - b.storyOrder);
  } else {
    copy.sort((a, b) => a.id - b.id);
  }
  return copy.map((item, idx) => ({ ...item, displayOrder: idx + 1 }));
}

function toggleItem(id) {
  if (watchedSet.has(id)) {
    watchedSet.delete(id);
    saveState("↩ İzlenmedi olarak güncellendi");
  } else {
    watchedSet.add(id);
    saveState("✓ İzlendi & Link güncellendi");
  }
  render();
}

function markNextWatched() {
  const ordered = getOrderedItems();
  const next = ordered.find(i => !watchedSet.has(i.id));
  if (next) toggleItem(next.id);
}

function toggleGroup(groupName) {
  if (collapsedGroups.has(groupName)) collapsedGroups.delete(groupName);
  else collapsedGroups.add(groupName);
  render();
}

function toggleAllGroups(collapse) {
  const ordered = getOrderedItems();
  const key = currentMode === "story" ? "era" : "phase";
  if (collapse) ordered.forEach(i => collapsedGroups.add(i[key]));
  else collapsedGroups.clear();
  render();
}

function resetAll() {
  if (!confirm("Tüm izleme işaretlerin sıfırlansın mı?")) return;
  watchedSet.clear();
  saveState("🗑 Tüm işaretler sıfırlandı");
  render();
}

function exportBackup() {
  const dataStr = JSON.stringify({ watched: [...watchedSet], exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mcu-watchlist-yedek.json";
  a.click();
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data.watched)) {
        watchedSet = new Set(data.watched);
        saveState("✓ Yedek başarıyla yüklendi");
        render();
      }
    } catch {
      alert("Geçersiz yedek dosyası.");
    }
  };
  reader.readAsText(file);
}

function render() {
  document.getElementById("btnRelease").classList.toggle("active", currentMode === "release");
  document.getElementById("btnStory").classList.toggle("active", currentMode === "story");

  const ordered = getOrderedItems();
  const total = ordered.length;
  const watchedCount = ordered.filter(i => watchedSet.has(i.id)).length;
  const pct = total ? Math.round((watchedCount / total) * 100) : 0;

  document.getElementById("totalStat").textContent = `${watchedCount} / ${total} (%${pct})`;
  document.getElementById("progressBar").style.width = `${pct}%`;

  const byType = t => ordered.filter(i => i.type === t);
  const countWatched = arr => arr.filter(i => watchedSet.has(i.id)).length;

  document.getElementById("statMovie").textContent = `${countWatched(byType("movie"))}/${byType("movie").length}`;
  document.getElementById("statSeries").textContent = `${countWatched(byType("series"))}/${byType("series").length}`;
  document.getElementById("statAnim").textContent = `${countWatched(byType("anim"))}/${byType("anim").length}`;
  document.getElementById("statSpecial").textContent = `${countWatched(byType("special"))}/${byType("special").length}`;

  const next = ordered.find(i => !watchedSet.has(i.id));
  const btnNext = document.getElementById("btnMarkNext");
  if (next) {
    document.getElementById("nextTitle").textContent = `#${String(next.displayOrder).padStart(2, "0")} • ${next.title}`;
    document.getElementById("nextMeta").textContent = `${next.year} • ${next.phase} • Hikaye Zamanı: ${next.storyTime}`;
    btnNext.disabled = false;
    btnNext.style.opacity = "1";
  } else {
    document.getElementById("nextTitle").textContent = "🎉 Tebrikler! Tüm MCU Maratonu Tamamlandı!";
    document.getElementById("nextMeta").textContent = "77/77 yapımın tamamını izledin.";
    btnNext.disabled = true;
    btnNext.style.opacity = "0.5";
  }

  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const typeF = document.getElementById("typeFilter").value;
  const statusF = document.getElementById("statusFilter").value;

  const filtered = ordered.filter(item => {
    const isW = watchedSet.has(item.id);
    if (typeF !== "all" && item.type !== typeF) return false;
    if (statusF === "watched" && !isW) return false;
    if (statusF === "unwatched" && isW) return false;
    if (q) {
      const hay = `${item.displayOrder} ${item.title} ${item.year} ${item.phase} ${item.storyTime}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const groupKey = currentMode === "story" ? "era" : "phase";
  const groups = new Map();
  filtered.forEach(item => {
    const g = item[groupKey];
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(item);
  });

  const container = document.getElementById("listContainer");
  if (!groups.size) {
    container.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);">Aramana uygun yapım bulunamadı.</div>`;
    return;
  }

  const typeLabel = { movie: "Film", series: "Dizi", anim: "Animasyon", special: "Özel Bölüm" };

  let html = "";
  groups.forEach((items, groupName) => {
    const doneInGroup = items.filter(i => watchedSet.has(i.id)).length;
    const isCollapsed = collapsedGroups.has(groupName);
    html += `
      <div class="group-block ${isCollapsed ? "collapsed" : ""}">
        <div class="group-header" onclick="toggleGroup('${groupName.replace(/'/g, "\\'")}')">
          <span class="group-title">${isCollapsed ? "▸" : "▾"} ${groupName}</span>
          <span class="group-count">${doneInGroup} / ${items.length}</span>
        </div>
        <ul class="item-list">
          ${items.map(item => {
            const watched = watchedSet.has(item.id);
            return `
              <li class="item-row ${watched ? "watched" : ""}" onclick="toggleItem(${item.id})">
                <div class="checkbox">${watched ? "✓" : ""}</div>
                <span class="order-num">#${String(item.displayOrder).padStart(2, "0")}</span>
                <div class="item-info">
                  <div class="item-title">${item.title}</div>
                  <div class="item-meta">
                    <span>📅 ${item.year}</span>
                    <span>⏳ ${item.storyTime}</span>
                    <span>${currentMode === "story" ? item.phase : item.era.split(":")[0]}</span>
                  </div>
                </div>
                <span class="tag tag-${item.type}">${typeLabel[item.type]}</span>
              </li>
            `;
          }).join("")}
        </ul>
      </div>
    `;
  });

  container.innerHTML = html;
}

window.addEventListener("hashchange", () => { loadState(); render(); });
loadState();
render();
</script>
